services:
  postgres:
    image: postgres:15-alpine
    container_name: spawner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-spawner}
      POSTGRES_USER: ${DB_USER:-spawner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-spawner}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - spawner-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-spawner}"]
      interval: 10s
      timeout: 5s
      retries: 5

  spawner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spawner
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000
      # PostgreSQL Configuration
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-spawner}
      - DB_PASSWORD=${DB_PASSWORD:-spawner}
      - DB_NAME=${DB_NAME:-spawner}
      - DATABASE_URL=postgresql://${DB_USER:-spawner}:${DB_PASSWORD:-spawner}@postgres:5432/${DB_NAME:-spawner}
      # Application Paths
      - GIT_KEYS_PATH=/opt/spawner/git-keys
      - REPOS_PATH=/opt/spawner/repos
      - ENVS_PATH=/opt/spawner/envs
      - DOCKER_SOCKET=/var/run/docker.sock
      # OAuth Configuration
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL:-http://localhost:8080/api/auth/github/callback}
      - GITHUB_ORG=${GITHUB_ORG}
      - GITHUB_TEAM=${GITHUB_TEAM}
      # Session Configuration
      - SESSION_SECRET=${SESSION_SECRET}
      - SESSION_MAX_AGE=${SESSION_MAX_AGE:-86400000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
    volumes:
      - /opt/spawner:/opt/spawner
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spawner-network

networks:
  spawner-network:
    driver: bridge

volumes:
  postgres-data:
