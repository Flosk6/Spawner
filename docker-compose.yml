# Local stack: Postgres, Traefik and Spawner, over plain HTTP.
#
# Environments get URLs under localtest.me, a public domain whose every
# subdomain resolves to 127.0.0.1, so no DNS setup is needed:
#   dashboard    http://spawner.localtest.me
#   environment  http://<env>--<project>.localtest.me
#
# SPAWNER_DATA_DIR is mounted at the same path in the container, so the paths
# Spawner writes in compose files are the same for the Docker daemon.
#
# Ports listen on 127.0.0.1 only, unless SPAWNER_HTTP_BIND says otherwise
# (0.0.0.0 for the end-to-end test, whose environments call the previews
# through the host).
#
# The firewall of install.sh's stack (firewall.nft) changes the host's rules
# for every container of Docker's bridge networks: here it only starts with
# --profile firewall, as the end-to-end test does.

services:
  postgres:
    image: postgres:15-alpine
    container_name: spawner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-spawner}
      POSTGRES_USER: ${DB_USER:-spawner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-spawner}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - spawner-core
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-spawner}"]
      interval: 5s
      timeout: 5s
      retries: 10

  traefik:
    image: traefik:v3.7
    container_name: spawner-traefik
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      # As install.sh writes it: request headers whose name aliases another
      # one (X_Spawner_Preview for X-Spawner-Preview) are dropped.
      - "--entrypoints.web.http.aliasheadersstrategy=delete"
      - "--log.level=INFO"
    ports:
      - "${SPAWNER_HTTP_BIND:-127.0.0.1}:${SPAWNER_HTTP_PORT:-80}:80"
    volumes:
      - ${SPAWNER_DATA_DIR:?set SPAWNER_DATA_DIR to an absolute path}/traefik:/etc/traefik/dynamic:ro
    networks:
      - spawner-core

  spawner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spawner
    restart: unless-stopped
    # A memory exhaustion of Spawner stops at its container, not at the host.
    mem_limit: ${SPAWNER_MEMORY_LIMIT:-1g}
    ports:
      - "${SPAWNER_HTTP_BIND:-127.0.0.1}:8080:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000
      # PostgreSQL
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-spawner}
      - DB_PASSWORD=${DB_PASSWORD:-spawner}
      - DB_NAME=${DB_NAME:-spawner}
      - DATABASE_URL=postgresql://${DB_USER:-spawner}:${DB_PASSWORD:-spawner}@postgres:5432/${DB_NAME:-spawner}
      # Engine
      - SPAWNER_DATA_DIR=${SPAWNER_DATA_DIR}
      - SPAWNER_PREVIEW_DOMAIN=${SPAWNER_PREVIEW_DOMAIN:-localtest.me}
      - SPAWNER_TLS=off
      - SPAWNER_TRAEFIK_CONTAINER=spawner-traefik
      # Qualified by its network: Traefik also joins every environment network.
      - SPAWNER_DASHBOARD_UPSTREAM=http://spawner.spawner-core:3000
      - SPAWNER_BOOTSTRAP_TOKEN=${SPAWNER_BOOTSTRAP_TOKEN:-}
      - DOCKER_SOCKET=/var/run/docker.sock
      # GitHub OAuth
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-unset}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-unset}
      - GITHUB_ORG=${GITHUB_ORG:-unset}
      - GITHUB_TEAM=${GITHUB_TEAM:-unset}
      # Session
      - SESSION_SECRET=${SESSION_SECRET:-}
      - SESSION_MAX_AGE=${SESSION_MAX_AGE:-86400000}
      - FRONTEND_URL=${FRONTEND_URL:-http://spawner.localtest.me}
    volumes:
      - ${SPAWNER_DATA_DIR}:${SPAWNER_DATA_DIR}
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spawner-core

  firewall:
    profiles: [firewall]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spawner-firewall
    restart: unless-stopped
    network_mode: host
    user: "0"
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    read_only: true
    entrypoint: ["/usr/bin/tini", "-g", "--"]
    command: ["sh", "-c", "while nft -f /app/firewall.nft; do sleep 60; done"]
    # Healthy while the rules are in place (the image's own check is the API's).
    healthcheck:
      test: ["CMD", "nft", "list", "table", "inet", "spawner"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  spawner-core:
    name: spawner-core

volumes:
  postgres-data:
