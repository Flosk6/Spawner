services:
  traefik:
    image: traefik:v2.11
    container_name: spawner-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=DEBUG"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    networks:
      - spawner-network
      - traefik-public
    labels:
      # Global HTTP to HTTPS redirect
      - "traefik.http.routers.http-catchall.rule=HostRegexp(`{host:.+}`)"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

  postgres:
    image: postgres:15-alpine
    container_name: spawner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - spawner-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  spawner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spawner
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      # PostgreSQL Configuration
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      # Application Paths
      - GIT_KEYS_PATH=/opt/spawner/git-keys
      - REPOS_PATH=/opt/spawner/repos
      - ENVS_PATH=/opt/spawner/envs
      - DOCKER_SOCKET=/var/run/docker.sock
      # OAuth Configuration
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_CALLBACK_URL=https://spawner.${DOMAIN}/api/auth/github/callback
      - GITHUB_ORG=${GITHUB_ORG}
      - GITHUB_TEAM=${GITHUB_TEAM}
      # Session Configuration
      - SESSION_SECRET=${SESSION_SECRET}
      - SESSION_MAX_AGE=86400000
      - FRONTEND_URL=https://spawner.${DOMAIN}
    volumes:
      - /opt/spawner:/opt/spawner
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spawner-network
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.spawner.rule=Host(`spawner.${DOMAIN}`)"
      - "traefik.http.routers.spawner.entrypoints=websecure"
      - "traefik.http.routers.spawner.tls.certresolver=letsencrypt"
      - "traefik.http.services.spawner.loadbalancer.server.port=3000"

networks:
  spawner-network:
    driver: bridge
  traefik-public:
    external: true

volumes:
  postgres-data:
  traefik-certs:
