# Production stack: Postgres, Traefik and Spawner, over HTTPS.
#
# Needs a DNS record *.<SPAWNER_PREVIEW_DOMAIN> pointing to this server:
#   dashboard    https://spawner.<SPAWNER_PREVIEW_DOMAIN>
#   environment  https://<env>--<project>.<SPAWNER_PREVIEW_DOMAIN>
#
# Certificates are obtained per host (TLS-ALPN challenge), so the Let's
# Encrypt limits apply: about 50 certificates per week and domain. The
# wildcard certificate (DNS-01) comes with the installer.
#
# SPAWNER_DATA_DIR is mounted at the same path in the container, so the paths
# Spawner writes in compose files are the same for the Docker daemon.
#
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d --build

services:
  postgres:
    image: postgres:15-alpine
    container_name: spawner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-spawner}
      POSTGRES_USER: ${DB_USER:-spawner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - spawner-core
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-spawner}"]
      interval: 10s
      timeout: 5s
      retries: 5

  traefik:
    image: traefik:v3.5
    container_name: spawner-traefik
    restart: unless-stopped
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${SPAWNER_DATA_DIR:-/opt/spawner}/traefik:/etc/traefik/dynamic:ro
      - traefik-certs:/letsencrypt
    networks:
      - spawner-core

  spawner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spawner
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      # PostgreSQL
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-spawner}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-spawner}
      - DATABASE_URL=postgresql://${DB_USER:-spawner}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-spawner}
      # Engine
      - SPAWNER_DATA_DIR=${SPAWNER_DATA_DIR:-/opt/spawner}
      - SPAWNER_PREVIEW_DOMAIN=${SPAWNER_PREVIEW_DOMAIN:?set SPAWNER_PREVIEW_DOMAIN, such as preview.example.com}
      - SPAWNER_TLS=letsencrypt
      - SPAWNER_TLS_RESOLVER=letsencrypt
      - SPAWNER_TRAEFIK_CONTAINER=spawner-traefik
      - SPAWNER_DASHBOARD_UPSTREAM=http://spawner:3000
      - SPAWNER_BOOTSTRAP_TOKEN=${SPAWNER_BOOTSTRAP_TOKEN:-}
      - DOCKER_SOCKET=/var/run/docker.sock
      # GitHub OAuth
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_ORG=${GITHUB_ORG}
      - GITHUB_TEAM=${GITHUB_TEAM}
      # Session
      - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET}
      - SESSION_MAX_AGE=${SESSION_MAX_AGE:-86400000}
      - FRONTEND_URL=https://spawner.${SPAWNER_PREVIEW_DOMAIN}
    volumes:
      - ${SPAWNER_DATA_DIR:-/opt/spawner}:${SPAWNER_DATA_DIR:-/opt/spawner}
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spawner-core

networks:
  spawner-core:
    name: spawner-core

volumes:
  postgres-data:
  traefik-certs:
