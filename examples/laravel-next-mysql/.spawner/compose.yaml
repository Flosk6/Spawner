services:
  db:
    image: mysql:8.4
    command:                  # a database for previews: no binary log, no performance schema, small buffers
      - --skip-log-bin
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-redo-log-capacity=16M
      - --innodb-flush-log-at-trx-commit=2
    environment:              # test credentials: the database is reachable from this environment only
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      retries: 60

  api:
    build: ../api
    environment:
      APP_NAME: blog (${SPAWNER_ENV})
      APP_ENV: preview
      APP_DEBUG: "true"
      APP_URL: ${SPAWNER_URL_API}
      FRONTEND_URL: ${SPAWNER_URL_WEB}
      LOG_CHANNEL: stderr     # Laravel's errors go to the service logs (spawner logs --errors)
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: app
      DB_USERNAME: app
      DB_PASSWORD: app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 3s
      retries: 60

  web:
    build: ../web
    environment:
      API_URL: http://api:8000                # server side, through the environment's network
      PUBLIC_API_URL: ${SPAWNER_URL_API}      # for the browser
      ENV_NAME: ${SPAWNER_ENV}
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
