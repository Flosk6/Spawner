services:
  db:
    image: postgres:18-alpine
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_wal_size=256MB", "-c", "synchronous_commit=off"]
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      retries: 30

  app:
    build: ..
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      PUBLIC_URL: ${SPAWNER_URL}
      ENV_NAME: ${SPAWNER_ENV}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      retries: 30

volumes:
  db-data:
