name: Release

# A tag v2.0.0 (or v2.0.0-rc.1) on a commit of master publishes the images on
# GHCR, the CLI on npm and a GitHub release with install.sh, the CLI bundle
# and their checksums. npm trusts this workflow and its environment (trusted
# publishing, set in the settings of the spawner-cli package on npmjs.com):
# no token is stored, and each version comes with its provenance.
# scripts/release.sh prepares the versions and the tag.
#
# The jobs that publish (image, npm, release) run in the "release"
# environment, whose reviewers approve twice per tag: first the image and npm
# together (both wait for the CLI build), then the GitHub release, which waits
# for the image. Nothing here reads a cache that another workflow could have
# written. Actions are pinned by commit (updated by Dependabot); the binfmt
# and BuildKit images by digest (updated by hand).
#
# GitHub runs the workflow of the tagged commit: these guards hold for tags
# on commits that carry them, so creating v* tags is restricted to admins by
# a tag ruleset of the repository.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/flosk6/spawner

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check that the tag is on master
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "::error::$GITHUB_REF_NAME is not on master: tag a commit of master"; exit 1; }
      - id: version
        name: Check that the tag matches the versions of the repository
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::$GITHUB_REF_NAME is not a version tag"; exit 1; }
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          if [ "$prerelease" = false ]; then
            for file in package.json apps/api/package.json apps/cli/package.json; do
              [ "$(node -p "require('./$file').version")" = "$version" ] || { echo "::error::$file is not at $version: run scripts/release.sh $version"; exit 1; }
            done
            grep -q "^DEFAULT_VERSION=\"$version\"$" install.sh || { echo "::error::install.sh does not install $version by default"; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  cli:
    name: CLI
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TURBO_TELEMETRY_DISABLED: 1
      SPAWNER_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install the dependencies without their install scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm turbo run build --filter=@spawner/cli...
      - name: Prepare the npm package
        run: |
          mkdir -p release/npm
          cp apps/cli/dist/spawner.cjs release/npm/spawner.cjs
          cp apps/cli/README.md LICENSE NOTICE release/npm/
          node -e '
            const fs = require("fs");
            fs.writeFileSync("release/npm/package.json", JSON.stringify({
              name: "spawner-cli",
              version: process.env.SPAWNER_VERSION,
              description: "Spawner CLI and MCP server: preview environments from a worktree, on your own server",
              keywords: ["preview", "environments", "docker", "compose", "mcp", "coding agents"],
              homepage: "https://github.com/Flosk6/Spawner",
              repository: { type: "git", url: "git+https://github.com/Flosk6/Spawner.git", directory: "apps/cli" },
              license: "Apache-2.0",
              bin: { spawner: "spawner.cjs" },
              files: ["spawner.cjs", "README.md", "LICENSE", "NOTICE"],
              engines: { node: ">=20" },
            }, null, 2) + "\n");
          '
          node release/npm/spawner.cjs --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli
          path: apps/cli/dist/spawner.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: release/npm

  image:
    name: Images on GHCR
    needs: [version, cli]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          cache-image: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          cache-binary: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Build and push linux/amd64 and linux/arm64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SPAWNER_VERSION=${{ needs.version.outputs.version }}

  npm:
    name: CLI on npm
    needs: [version, cli]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check that npm can publish through trusted publishing (11.5.1 or later)
        run: |
          npm_version="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n 1)" != 11.5.1 ]; then
            echo "::error::Node $(node --version) bundles npm $npm_version, older than 11.5.1: use a Node release whose npm supports trusted publishing"
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: npm-package
      - name: Publish spawner-cli
        working-directory: npm-package
        run: |
          if [ -n "$(npm view "spawner-cli@$VERSION" version 2>/dev/null)" ]; then
            echo "::notice::spawner-cli@$VERSION is already on npm"
            exit 0
          fi
          npm publish --ignore-scripts --access public --tag ${{ needs.version.outputs.prerelease == 'true' && 'next' || 'latest' }}

  release:
    name: GitHub release
    needs: [version, image, cli]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli
          path: release
      - name: Assets and notes
        run: |
          mv release/spawner.cjs release/spawner
          cp install.sh release/install.sh
          (cd release && sha256sum install.sh spawner > SHA256SUMS)
          awk -v version="$VERSION" '
            $0 ~ "^## " { if (found) exit; found = ($2 == version) ; next }
            found { print }
          ' CHANGELOG.md > release/notes.md
          [ -s release/notes.md ] || echo "Spawner $VERSION." > release/notes.md
          cat >> release/notes.md <<EOF

          ## Install or upgrade

          \`\`\`bash
          curl -fsSL https://github.com/Flosk6/Spawner/releases/download/v$VERSION/install.sh | sudo bash -s -- --version $VERSION
          \`\`\`

          Image: \`${IMAGE}:${VERSION}\` (linux/amd64, linux/arm64). CLI: \`npm install -g spawner-cli@$VERSION\`, or the \`spawner\` file below.
          EOF
      - name: Create the release
        run: |
          gh release create "v$VERSION" release/install.sh release/spawner release/SHA256SUMS \
            --title "Spawner $VERSION" --notes-file release/notes.md \
            ${{ needs.version.outputs.prerelease == 'true' && '--prerelease' || '--latest' }}
