name: Release

# A tag v2.0.0 (or v2.0.0-rc.1) on a commit of master publishes the images on
# GHCR, the CLI on npm and a GitHub release with install.sh, the CLI bundle
# and their checksums. npm trusts this workflow and its environment (trusted
# publishing, set in the settings of the spawner-cli package on npmjs.com):
# no token is stored, and each version comes with its provenance. The
# images, install.sh and the CLI bundle get build provenance attestations
# (gh attestation verify), and the install.sh of a release names the digest
# of its image, so that it installs what this workflow built.
# scripts/release.sh prepares the versions and the tag.
#
# Once the GitHub release of a stable version exists, the release job asks
# the website (Flosk6/spawner-site) to rebuild, since it builds its docs from
# the latest release. It does so with SITE_DISPATCH_TOKEN, a secret of the
# "release" environment: a fine-grained token that can write the contents of
# that repository only (repository_dispatch needs it), which no other job
# reads. Without it, the website follows at its daily build.
#
# Once npm has a stable version, its server.json goes to the official MCP
# Registry, which trusts this repository's OIDC token for the names
# io.github.Flosk6/* (the owner's case: the registry compares it as is). That
# job comes last and may fail without undoing or holding back anything else.
#
# The jobs that publish (image, npm, release) run in the "release"
# environment, whose reviewers approve twice per tag: first the image and npm
# together (both wait for the CLI build), then the GitHub release, which waits
# for the image. Nothing here reads a cache that another workflow could have
# written. Actions are pinned by commit (updated by Dependabot); the binfmt
# and BuildKit images by digest, mcp-publisher by version and checksum
# (updated by hand).
#
# GitHub runs the workflow of the tagged commit: these guards hold for tags
# on commits that carry them, so creating v* tags is restricted to admins by
# a tag ruleset of the repository.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/flosk6/spawner
  DESCRIPTION: "Spawner is an open source, self-hosted preview environment manager: a copy of your app for each git branch, on your own server, with its own URLs, database and logs, for teams and their coding agents."

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check that the tag is on master
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "::error::$GITHUB_REF_NAME is not on master: tag a commit of master"; exit 1; }
      - id: version
        name: Check that the tag matches the versions of the repository
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::$GITHUB_REF_NAME is not a version tag"; exit 1; }
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          if [ "$prerelease" = false ]; then
            for file in package.json apps/api/package.json apps/cli/package.json; do
              [ "$(node -p "require('./$file').version")" = "$version" ] || { echo "::error::$file is not at $version: run scripts/release.sh $version"; exit 1; }
            done
            grep -q "^DEFAULT_VERSION=\"$version\"$" install.sh || { echo "::error::install.sh does not install $version by default"; exit 1; }
          fi
          grep -q '^IMAGE_DIGEST=""$' install.sh || { echo "::error::install.sh should hold IMAGE_DIGEST=\"\", which the release fills"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  cli:
    name: CLI
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TURBO_TELEMETRY_DISABLED: 1
      SPAWNER_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install the dependencies without their install scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm turbo run build --filter=@spawner/cli...
      - name: Prepare the npm package
        run: |
          mkdir -p release/npm
          cp apps/cli/dist/spawner.cjs release/npm/spawner.cjs
          cp apps/cli/README.md LICENSE NOTICE release/npm/
          node -e '
            const fs = require("fs");
            fs.writeFileSync("release/npm/package.json", JSON.stringify({
              name: "spawner-cli",
              version: process.env.SPAWNER_VERSION,
              description: "The CLI and MCP server of Spawner, an open source, self-hosted preview environment manager: a copy of your app for each git branch, on your own server, with its own URLs, database and logs.",
              keywords: [
                "preview-environments", "ephemeral-environments", "review-apps", "self-hosted", "docker-compose",
                "mcp", "mcp-server", "coding-agents", "claude-code", "codex", "cursor", "devops", "cli",
              ],
              homepage: "https://spawner.run",
              repository: { type: "git", url: "git+https://github.com/Flosk6/Spawner.git", directory: "apps/cli" },
              bugs: { url: "https://github.com/Flosk6/Spawner/issues" },
              mcpName: require("./server.json").name,
              license: "Apache-2.0",
              bin: { spawner: "spawner.cjs" },
              files: ["spawner.cjs", "README.md", "LICENSE", "NOTICE"],
              engines: { node: ">=20" },
            }, null, 2) + "\n");
          '
          node release/npm/spawner.cjs --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli
          path: apps/cli/dist/spawner.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: release/npm

  image:
    name: Images on GHCR
    needs: [version, cli]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          cache-binary: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The labels and the annotations replace those of the Dockerfile and
      # of the repository's settings; the annotations of the index are what
      # GHCR shows for an image of several platforms.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=Spawner
            org.opencontainers.image.description=${{ env.DESCRIPTION }}
            org.opencontainers.image.url=https://spawner.run
            org.opencontainers.image.documentation=https://spawner.run/docs/
          annotations: |
            org.opencontainers.image.title=Spawner
            org.opencontainers.image.description=${{ env.DESCRIPTION }}
            org.opencontainers.image.url=https://spawner.run
            org.opencontainers.image.documentation=https://spawner.run/docs/
      - name: Build and push linux/amd64 and linux/arm64
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: SPAWNER_VERSION=${{ needs.version.outputs.version }}
      - name: Attest the provenance of the images
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  npm:
    name: CLI on npm
    needs: [version, cli]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check that npm can publish through trusted publishing (11.5.1 or later)
        run: |
          npm_version="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n 1)" != 11.5.1 ]; then
            echo "::error::Node $(node --version) bundles npm $npm_version, older than 11.5.1: use a Node release whose npm supports trusted publishing"
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: npm-package
      - name: Publish spawner-cli
        working-directory: npm-package
        run: |
          if [ -n "$(npm view "spawner-cli@$VERSION" version 2>/dev/null)" ]; then
            echo "::notice::spawner-cli@$VERSION is already on npm"
            exit 0
          fi
          npm publish --ignore-scripts --access public --tag ${{ needs.version.outputs.prerelease == 'true' && 'next' || 'latest' }}

  release:
    name: GitHub release
    needs: [version, image, cli]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DIGEST: ${{ needs.image.outputs.digest }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli
          path: release
      - name: Assets and notes
        run: |
          mv release/spawner.cjs release/spawner
          cp install.sh release/install.sh
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::the image job gave no digest: $DIGEST"; exit 1; }
          # A prerelease's installer installs another version by default: it pins nothing.
          if [ "$PRERELEASE" = false ]; then
            sed -i "s/^IMAGE_DIGEST=\"\"$/IMAGE_DIGEST=\"$DIGEST\"/" release/install.sh
            grep -q "^IMAGE_DIGEST=\"$DIGEST\"$" release/install.sh || { echo "::error::the digest could not be written into install.sh"; exit 1; }
          fi
          (cd release && sha256sum install.sh spawner > SHA256SUMS)
          awk -v version="$VERSION" '
            $0 ~ "^## " { if (found) exit; found = ($2 == version) ; next }
            found { print }
          ' CHANGELOG.md > release/changes.md
          [ -s release/changes.md ] || echo "Spawner $VERSION." > release/changes.md
          download="https://github.com/Flosk6/Spawner/releases/download/v$VERSION"
          {
            echo "$DESCRIPTION [Documentation](https://spawner.run/docs/), [changelog](https://spawner.run/changelog/)."
            echo
            cat release/changes.md
            cat <<EOF

          ## Install

          On a new server:

          \`\`\`bash
          curl -fsSL $download/install.sh | sudo bash -s -- --version $VERSION
          \`\`\`

          ## Upgrade

          From the dashboard: **Update to $VERSION** on the System page. From the server:

          \`\`\`bash
          curl -fsSL $download/install.sh | sudo bash -s -- --upgrade --version $VERSION
          \`\`\`

          Both back the database up first, and go back to the previous version if the new one does not start.

          ## Files

          - \`install.sh\`: the installer of this version.
          - \`spawner\`: the CLI and MCP server in one file, for Node.js 20 or later. Or \`npm install -g spawner-cli@$VERSION\`.
          - \`SHA256SUMS\`: their checksums.
          - Image: \`${IMAGE}:${VERSION}\` (\`${DIGEST}\`, linux/amd64, linux/arm64).

          ## Verify

          The image, \`install.sh\` and \`spawner\` carry build provenance attestations from this repository's release workflow:

          \`\`\`bash
          gh attestation verify install.sh -R Flosk6/Spawner
          gh attestation verify oci://${IMAGE}:$VERSION -R Flosk6/Spawner
          \`\`\`

          Or compare the files with their checksums: \`curl -fsSL -O $download/install.sh -O $download/SHA256SUMS && sha256sum -c --ignore-missing SHA256SUMS\`
          EOF
          } > release/notes.md
      - name: Attest the provenance of install.sh and the CLI bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/install.sh
            release/spawner
      - name: Create the release
        run: |
          gh release create "v$VERSION" release/install.sh release/spawner release/SHA256SUMS \
            --title "Spawner $VERSION" --notes-file release/notes.md \
            ${{ needs.version.outputs.prerelease == 'true' && '--prerelease' || '--latest' }}
      - name: Ask spawner.run to rebuild its docs
        if: env.PRERELEASE == 'false'
        continue-on-error: true
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$SITE_DISPATCH_TOKEN" ]; then
            echo "::notice::no SITE_DISPATCH_TOKEN: spawner.run follows this release at its daily build"
            exit 0
          fi
          GH_TOKEN="$SITE_DISPATCH_TOKEN" gh api --method POST repos/Flosk6/spawner-site/dispatches \
            -f event_type=spawner-release -f "client_payload[version]=$VERSION"

  mcp-registry:
    name: MCP server on the MCP Registry
    needs: [version, npm]
    if: needs.version.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MCP_PUBLISHER_VERSION: 1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mcp-publisher, checked against its checksum
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Wait until npm serves spawner-cli@${{ needs.version.outputs.version }} with its mcpName
        run: |
          name="$(jq -r .name server.json)"
          for _ in $(seq 1 30); do
            [ "$(curl -fsS "https://registry.npmjs.org/spawner-cli/$VERSION" 2>/dev/null | jq -r .mcpName)" = "$name" ] && exit 0
            sleep 10
          done
          echo "::error::spawner-cli@$VERSION on npm has no mcpName $name: the MCP Registry would refuse it"
          exit 1
      - name: Publish server.json at version ${{ needs.version.outputs.version }}
        run: |
          jq --arg version "$VERSION" '.version = $version | .packages[].version = $version' server.json > release-server.json
          name="$(jq -r .name release-server.json)"
          if curl -fsS -o /dev/null "https://registry.modelcontextprotocol.io/v0.1/servers/$(jq -rn --arg name "$name" '$name | @uri')/versions/$VERSION"; then
            echo "::notice::$name $VERSION is already on the MCP Registry"
            exit 0
          fi
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish release-server.json
